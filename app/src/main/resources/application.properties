spring.application.name=spring-boot-cms

# MySQL datasource (env-based defaults)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cms?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT configuration
cms.jwt.secret=${CMS_JWT_SECRET:ChangeThisJwtSecretToAStrongValueWithAtLeast32Characters}
cms.jwt.expiration-ms=${CMS_JWT_EXPIRATION_MS:3600000}
