spring.application.name=spring-boot-cms

# spring-dotenv: .env file is in the project root (one level up from app/)
env.directory=../

# MySQL datasource (loaded from .env via spring-dotenv)
spring.datasource.url=jdbc:mysql://localhost:${MYSQLDB_LOCAL_PORT}/${MYSQLDB_DATABASE}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLDB_USER}
spring.datasource.password=${MYSQLDB_ROOT_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT configuration
cms.jwt.secret=${CMS_JWT_SECRET}
cms.jwt.expiration-ms=${CMS_JWT_EXPIRATION_MS}
